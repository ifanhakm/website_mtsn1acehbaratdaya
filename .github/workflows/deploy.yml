name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify code quality
        run: |
          npm ci
          npm run check

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=production
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://mtsn1acehbaratdaya.sch.id
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/mtsn1acehbaratdaya'
          scp deploy/compose.yml deploy/Caddyfile "$VPS_USER@$VPS_HOST:/opt/mtsn1acehbaratdaya/"

      - name: Configure safe production database settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -eu
            cd /opt/mtsn1acehbaratdaya
            test -f .env.production
            temp_file=$(mktemp .env.production.XXXXXX)
            trap "rm -f $temp_file" EXIT
            grep -vE "^(ALLOW_DEV_SCHEMA_PUSH|RUN_DATABASE_MIGRATIONS)=" .env.production > "$temp_file"
            # The existing database still contains a Payload development
            # migration marker (batch = -1). Enabling production migrations
            # before it is baselined opens an interactive prompt and blocks
            # every database-backed request indefinitely.
            printf "\nALLOW_DEV_SCHEMA_PUSH=false\nRUN_DATABASE_MIGRATIONS=false\n" >> "$temp_file"
            chmod --reference=.env.production "$temp_file"
            mv "$temp_file" .env.production
            trap - EXIT
          '

      - name: Deploy production image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh "$VPS_USER@$VPS_HOST" 'cd /opt/mtsn1acehbaratdaya && docker compose --env-file .env.deploy pull && docker compose --env-file .env.deploy up -d --remove-orphans && docker image prune -f'
          ssh "$VPS_USER@$VPS_HOST" 'for attempt in $(seq 1 12); do if docker inspect --format="{{.State.Health.Status}}" mtsn1acehbaratdaya-app-1 | grep -q healthy; then exit 0; fi; sleep 5; done; docker compose -f /opt/mtsn1acehbaratdaya/compose.yml logs --tail=100 app; exit 1'
          ssh "$VPS_USER@$VPS_HOST" 'for attempt in $(seq 1 3); do if docker exec mtsn1acehbaratdaya-app-1 node -e "fetch(\"http://127.0.0.1:3000/ready\", { signal: AbortSignal.timeout(15000) }).then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"; then exit 0; fi; sleep 5; done; docker compose -f /opt/mtsn1acehbaratdaya/compose.yml logs --tail=100 app; exit 1'
